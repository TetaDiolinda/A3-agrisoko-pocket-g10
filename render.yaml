# Optional: one-click deploy of the FastAPI service on Render.com (free plan)
services:
  - type: web
    name: agrisoko-pocket-g10-api
    runtime: python
    rootDir: ai-api
    buildCommand: pip install -r requirements.txt && python build_index.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
